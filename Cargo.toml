[package]
name = "standup"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "=4.5.0",  features = ["derive"] }
git2 = "0.19"
chrono = { version = "0.4", features = ["serde"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1"
